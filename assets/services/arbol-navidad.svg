<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Árbol de Navidad decorado en rojo, blanco y dorado">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDFC"/>
      <stop offset="0.55" stop-color="#FFF7F5"/>
      <stop offset="1" stop-color="#FBE9EA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8A0A6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E8A0A6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B7A4B"/>
      <stop offset="1" stop-color="#0B4A2E"/>
    </linearGradient>
    <linearGradient id="treeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#21935A"/>
      <stop offset="1" stop-color="#0E5736"/>
    </linearGradient>
    <linearGradient id="treeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27A566"/>
      <stop offset="1" stop-color="#116240"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8232F"/>
      <stop offset="1" stop-color="#A80F1A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE7A3"/>
      <stop offset="0.5" stop-color="#F4C542"/>
      <stop offset="1" stop-color="#C9971F"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#7A0B12" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="800" cy="330" r="290" fill="url(#halo)"/>
  <ellipse cx="800" cy="330" rx="330" ry="300" fill="url(#glow)" opacity="0.7"/>

  <!-- Piso -->
  <rect x="0" y="592" width="1200" height="83" fill="#F6E2E4"/>
  <ellipse cx="800" cy="598" rx="310" ry="34" fill="#E7C3C7" opacity="0.55" filter="url(#soft)"/>

  <!-- Destellos suaves -->
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="180" cy="130" r="7"/>
    <circle cx="285" cy="205" r="4"/>
    <circle cx="145" cy="330" r="5"/>
    <circle cx="1080" cy="150" r="6"/>
    <circle cx="1010" cy="245" r="4"/>
    <circle cx="1120" cy="390" r="5"/>
    <circle cx="390" cy="115" r="4"/>
    <circle cx="960" cy="90" r="3"/>
  </g>

  <!-- Árbol -->
  <g filter="url(#shadow)">
    <rect x="780" y="512" width="40" height="62" rx="10" fill="#7B4A24"/>
    <polygon points="560,532 800,300 1040,532" fill="url(#tree)"/>
    <polygon points="610,428 800,232 990,428" fill="url(#treeMid)"/>
    <polygon points="662,330 800,162 938,330" fill="url(#treeTop)"/>
  </g>

  <!-- Sombras internas de las capas -->
  <g opacity="0.22" fill="#062B1B">
    <polygon points="560,532 800,300 1040,532 960,532 800,356 640,532"/>
    <polygon points="610,428 800,232 990,428 926,428 800,282 674,428"/>
    <polygon points="662,330 800,162 938,330 886,330 800,206 714,330"/>
  </g>

  <!-- Estrella -->
  <g filter="url(#shadow)">
    <polygon points="800,96 814,132 853,132 821,155 833,192 800,169 767,192 779,155 747,132 786,132"
             fill="url(#gold)" stroke="#B8860B" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <circle cx="800" cy="145" r="52" fill="#FFDD77" opacity="0.30" filter="url(#soft)"/>

  <!-- Luces cálidas -->
  <g fill="#FFE8A8">
    <circle cx="740" cy="262" r="6"/>
    <circle cx="858" cy="282" r="6"/>
    <circle cx="700" cy="366" r="6"/>
    <circle cx="900" cy="372" r="6"/>
    <circle cx="650" cy="470" r="7"/>
    <circle cx="948" cy="476" r="7"/>
  </g>
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="780" cy="222" r="3"/>
    <circle cx="822" cy="308" r="3"/>
    <circle cx="748" cy="408" r="3"/>
    <circle cx="862" cy="418" r="3"/>
    <circle cx="704" cy="492" r="4"/>
    <circle cx="896" cy="498" r="4"/>
  </g>

  <!-- Esferas rojas -->
  <g>
    <circle cx="725" cy="300" r="15" fill="url(#red)"/>
    <circle cx="866" cy="332" r="17" fill="url(#red)"/>
    <circle cx="676" cy="420" r="16" fill="url(#red)"/>
    <circle cx="920" cy="432" r="15" fill="url(#red)"/>
    <circle cx="742" cy="482" r="18" fill="url(#red)"/>
    <circle cx="862" cy="492" r="16" fill="url(#red)"/>
  </g>
  <!-- Esferas blancas -->
  <g fill="#FFFFFF" stroke="#E7C9CB" stroke-width="2">
    <circle cx="812" cy="252" r="12"/>
    <circle cx="762" cy="368" r="13"/>
    <circle cx="846" cy="400" r="12"/>
    <circle cx="790" cy="452" r="14"/>
    <circle cx="678" cy="500" r="12"/>
    <circle cx="930" cy="496" r="13"/>
  </g>
  <!-- Esferas doradas -->
  <g fill="url(#gold)" stroke="#C9971F" stroke-width="1.5">
    <circle cx="782" cy="286" r="9"/>
    <circle cx="700" cy="392" r="9"/>
    <circle cx="890" cy="462" r="10"/>
    <circle cx="822" cy="332" r="8"/>
  </g>

  <!-- Regalos -->
  <g filter="url(#shadow)">
    <rect x="574" y="516" width="126" height="104" rx="8" fill="url(#red)"/>
    <rect x="618" y="516" width="38" height="104" fill="#FFF8F3"/>
    <rect x="574" y="553" width="126" height="26" fill="#FFF8F3"/>
    <path d="M637 516c-16-24-48-26-48-6 0 12 18 14 48 6Z" fill="#FFF8F3"/>
    <path d="M637 516c16-24 48-26 48-6 0 12-18 14-48 6Z" fill="#FFF8F3"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="880" y="536" width="112" height="88" rx="8" fill="#FFFFFF"/>
    <rect x="920" y="536" width="32" height="88" fill="url(#red)"/>
    <rect x="880" y="566" width="112" height="22" fill="url(#red)"/>
    <circle cx="936" cy="536" r="14" fill="url(#red)"/>
  </g>

  <!-- Borde decorativo suave -->
  <rect x="1.5" y="1.5" width="1197" height="672" rx="0" fill="none" stroke="#F1D3D6" stroke-width="3"/>
</svg>
